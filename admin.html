<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온담 · 관리자</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --ink: #1c1f24;
        --ink-soft: #6b7280;
        --line: #e2e5ea;
        --accent: #3358c8;
        --danger: #c0392b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }
      main { width: 100%; max-width: 720px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 28px; }

      #loginBox {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        max-width: 360px;
        margin: 60px auto;
      }
      #loginBox label { display: block; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; }
      #loginBox input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 12px;
      }
      #loginBox button {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      #loginError { color: var(--danger); font-size: 13px; margin: 0 0 10px; display: none; }

      #dashboard { display: none; }
      .summary {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .summary b { font-size: 20px; }

      table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
      th { color: var(--ink-soft); font-weight: 600; font-size: 12px; text-transform: uppercase; background: #fafbfc; }
      tr:last-child td { border-bottom: none; }
      td.mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      .empty { color: var(--ink-soft); text-align: center; padding: 30px 0; font-size: 14px; }
      #logoutBtn {
        background: none; border: 1px solid var(--line); border-radius: 8px;
        padding: 6px 12px; font-size: 13px; color: var(--ink-soft); cursor: pointer;
      }
      .topRow { display: flex; justify-content: space-between; align-items: flex-start; }
    </style>
  </head>
  <body>
    <main>
      <div id="loginBox">
        <h1>온담 관리자</h1>
        <p class="sub">내부 테스트용 조회 전용 대시보드입니다.</p>
        <p id="loginError">비밀번호가 올바르지 않아요.</p>
        <label for="pwInput">관리자 비밀번호</label>
        <input type="password" id="pwInput" placeholder="비밀번호 입력" />
        <button onclick="doLogin()">들어가기</button>
      </div>

      <div id="dashboard">
        <div class="topRow">
          <div>
            <h1>온담 관리자</h1>
            <p class="sub">회원 목록 · 분석 기록 수 (조회 전용)</p>
          </div>
          <button id="logoutBtn" onclick="doLogout()">나가기</button>
        </div>
        <div class="summary">전체 회원 <b id="totalCount">-</b>명</div>
        <table>
          <thead>
            <tr><th>이름</th><th>전화번호</th><th>가입일</th><th>분석 기록</th></tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
        <div id="emptyState" class="empty" style="display:none">아직 가입한 회원이 없어요.</div>
      </div>
    </main>

    <script>
      const AI_WORKER_URL = 'https://ondam-ai.kke88084.workers.dev';
      const PW_KEY = 'ondam_admin_pw';

      function getPw(){ return sessionStorage.getItem(PW_KEY) || ''; }
      function setPw(pw){ sessionStorage.setItem(PW_KEY, pw); }
      function clearPw(){ sessionStorage.removeItem(PW_KEY); }

      async function doLogin(){
        const pw = document.getElementById('pwInput').value;
        const errEl = document.getElementById('loginError');
        errEl.style.display = 'none';
        try {
          const res = await fetch(AI_WORKER_URL + '/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
          });
          if (!res.ok) { errEl.style.display = 'block'; return; }
          setPw(pw);
          showDashboard();
        } catch (err) {
          errEl.textContent = '접속에 실패했어요. 잠시 후 다시 시도해주세요.';
          errEl.style.display = 'block';
        }
      }

      function doLogout(){
        clearPw();
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('pwInput').value = '';
      }

      function escapeHtml(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
      }

      async function loadUsers(){
        const pw = getPw();
        const res = await fetch(AI_WORKER_URL + '/admin/users', {
          headers: { 'X-Admin-Password': pw },
        });
        if (res.status === 401) { doLogout(); return; }
        const data = await res.json();
        const users = data.users || [];
        document.getElementById('totalCount').textContent = data.totalCount != null ? data.totalCount : users.length;
        const rowsEl = document.getElementById('userRows');
        const emptyEl = document.getElementById('emptyState');
        if (users.length === 0) {
          rowsEl.innerHTML = '';
          emptyEl.style.display = 'block';
          return;
        }
        emptyEl.style.display = 'none';
        rowsEl.innerHTML = users.map((u) => `
          <tr>
            <td>${escapeHtml(u.name) || '<span style="color:var(--ink-soft)">(이름 없음)</span>'}</td>
            <td class="mono">${escapeHtml(u.phone)}</td>
            <td class="mono">${escapeHtml((u.createdAt || '').slice(0, 10))}</td>
            <td>${escapeHtml(u.historyCount)}건</td>
          </tr>`).join('');
      }

      function showDashboard(){
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadUsers();
      }

      document.getElementById('pwInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });

      if (getPw()) showDashboard();
    </script>
  </body>
</html>
